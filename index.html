<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天去哪玩 - 北北基</title>
<style>
/* ============================================================
   溫暖、彩色、好逛。
   色彩分工是刻意的，避免變成調色盤大亂鬥：
     Primary #4F8EF7  互動狀態（選取中的篩選、連結、focus）
     Accent  #FFB84D  步行時間，也就是這個產品的差異化資訊
     類別色            每個類別一個柔和色調，讓清單一眼有層次
     捷運路線色         縮成 3px 細條，保留真實資訊但不搶戲
   ============================================================ */
:root{
  --paper:#FAF8F5; --card:#FFFFFF; --primary:#4F8EF7; --accent:#FFB84D;
  --primary-ink:#2C63C4;   /* 小字專用，確保 WCAG AA */
  --ink:#222222; --ink-2:#6F6F6F; --ink-3:#938d85; --border:#ECE8E2;
  /* 次要文字原訂 #777777，在 #FAF8F5 上只有 4.22:1，微調至 #6F6F6F 通過 AA */
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(60,50,40,.04), 0 6px 16px -8px rgba(60,50,40,.10);
  --shadow-h:0 2px 4px rgba(60,50,40,.06), 0 14px 28px -12px rgba(79,142,247,.24);
  --BR:#c48c31; --R:#e3002c; --G:#107547; --O:#f8b61c; --BL:#0070bd; --Y:#e8c500;
  --TRA:#8a7259; --LB:#2b5fa8; --LRT:#00a0a0;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#1a1815; --card:#232019; --primary:#7BAAFA; --accent:#FFC670;
    --primary-ink:#9EC2FF;
    --ink:#F2EEE8; --ink-2:#a8a096; --ink-3:#8a8278; --border:#38332b;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 16px -8px rgba(0,0,0,.5);
    --shadow-h:0 2px 4px rgba(0,0,0,.35), 0 14px 28px -12px rgba(123,170,250,.28);
    --TRA:#b09a80; --LB:#6f9de0; --LRT:#3ec9c9; --Y:#ffdb00;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Hiragino Sans TC",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;font-feature-settings:"tnum" 1}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- 頁首 ---------- */
header{padding:26px 0 18px}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{width:clamp(200px,30vw,264px);height:auto;display:block}
.scope{display:flex;gap:7px;flex-wrap:wrap}
.scope span{font-size:14px;font-weight:600;color:var(--ink-2);background:var(--card);
  border:1px solid var(--border);border-radius:999px;padding:5px 14px;box-shadow:var(--shadow)}
.updated{order:99;margin-left:auto;text-align:right;font-size:11.5px;color:var(--ink-3);
  line-height:1.5;flex:none}
.updated b{display:block;font-weight:600;color:var(--ink-2);font-size:12.5px;
  font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace}
@media (max-width:560px){ .updated{order:0;margin-left:0;text-align:left;width:100%} }

/* ---------- 搜尋 ---------- */
.searchbox{position:relative;margin-bottom:11px}
.searchbox input{width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--card);border:1px solid var(--border);border-radius:999px;
  padding:11px 44px 11px 42px;line-height:1.4;
  transition:border-color .18s, box-shadow .18s}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.searchbox input:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent)}
.searchbox .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  font-size:15px;pointer-events:none;opacity:.65}
.searchbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:0;background:none;font-family:inherit;font-size:17px;color:var(--ink-3);
  cursor:pointer;padding:6px 10px;border-radius:999px;line-height:1}
.searchbox .clr:hover{color:var(--ink);background:color-mix(in srgb, var(--ink) 7%, transparent)}
.searchbox .clr[hidden]{display:none}

/* ---------- 篩選 ---------- */
.filters{position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--border);padding:14px 0 12px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.frow:last-child{margin-bottom:0}
.flabel{font-size:11.5px;color:var(--ink-3);width:40px;flex:none;letter-spacing:.05em}
.chip{border:1px solid var(--border);background:var(--card);color:var(--ink-2);
  border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;font-family:inherit;
  line-height:1.45;transition:all .18s cubic-bezier(.16,1,.3,1)}
.chip:hover{border-color:var(--primary);color:var(--primary-ink);transform:translateY(-1px)}
.chip:active{transform:translateY(0)}
.chip[aria-pressed="true"]{background:var(--primary-ink);border-color:var(--primary-ink);color:#fff;
  box-shadow:0 4px 12px -4px color-mix(in srgb, var(--primary) 55%, transparent)}
.chip[aria-pressed="true"] .n{opacity:.8}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.chip .n{font-size:11px;opacity:.55;margin-left:5px}
.reset{margin-left:auto;background:none;border:0;color:var(--ink-3);font-size:12.5px;
  cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px;padding:4px}
.reset:hover{color:var(--primary-ink)}

/* ---------- 分組 ---------- */
.count{padding:22px 0 2px;font-size:13px;color:var(--ink-3)}
.ghead{display:flex;align-items:baseline;gap:10px;padding:24px 0 12px}
.ghead h2{font-size:17px;font-weight:700;letter-spacing:-.015em}
.ghead em{font-style:normal;color:var(--ink-3);font-size:12.5px}
.ghead .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;
  align-self:center}

/* ---------- 活動卡 ---------- */
.grid{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;
  padding:14px 16px;text-decoration:none;color:inherit;
  background:color-mix(in srgb, var(--card) 82%, transparent);
  border:1px solid color-mix(in srgb, var(--border) 70%, transparent);
  border-radius:var(--r);box-shadow:var(--shadow);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:transform .2s cubic-bezier(.16,1,.3,1), box-shadow .2s, border-color .2s}
a.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);
  border-color:color-mix(in srgb, var(--primary) 42%, transparent)}
a.card:hover .title{color:var(--primary-ink)}
a.card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}


.body{display:flex;flex-direction:column;gap:6px;min-width:0}
.title{font-size:15.5px;font-weight:600;letter-spacing:-.012em;line-height:1.4;
  transition:color .18s}
.venue{font-size:12.5px;color:var(--ink-2);line-height:1.45;display:flex;
  align-items:center;gap:7px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;
  background:color-mix(in srgb, var(--c,var(--primary)) 14%, transparent);
  color:color-mix(in srgb, var(--c,var(--primary)) 70%, var(--ink));
  border:1px solid color-mix(in srgb, var(--c,var(--primary)) 24%, transparent)}
.foot{display:flex;align-items:center;gap:11px;flex-wrap:wrap}

/* 步行時間用 Accent，因為這是產品的差異化資訊 */
.trans{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);
  background:color-mix(in srgb, var(--accent) 15%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-radius:999px;padding:3px 10px 3px 7px}
.trans.none{background:transparent;border-color:var(--border);color:var(--ink-3)}
.bars{display:flex;gap:2px;flex:none}
.bar{width:3px;height:12px;border-radius:2px;background:var(--ink-3)}
.walk{font-weight:700;color:var(--ink)}

.meta{text-align:right;flex:none;display:flex;flex-direction:column;
  align-items:flex-end;gap:6px}
.tag{font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);
  color:var(--ink-2);white-space:nowrap;background:var(--card)}
.tag.free{border-color:color-mix(in srgb, var(--primary) 40%, transparent);
  color:var(--primary-ink);font-weight:700;
  background:color-mix(in srgb, var(--primary) 11%, transparent)}
.tag.unk{border-style:dashed;color:var(--ink-3);background:transparent}
.until{font-size:12px;color:var(--ink-3);white-space:nowrap}
.until.perm{color:color-mix(in srgb, var(--accent) 78%, var(--ink));font-weight:600}
.nolink{font-size:11.5px;color:var(--ink-3)}
.nolink.golink{color:var(--primary-ink);font-weight:600}

.empty{padding:64px 20px;text-align:center;border:1px dashed var(--border);
  border-radius:var(--r);margin-top:20px;background:var(--card)}
.empty p{color:var(--ink-2);font-size:14px}
.empty button{margin-top:16px}

footer{margin:56px 0 44px;padding:20px 22px;border:1px solid var(--border);
  border-radius:var(--r);background:var(--card);
  font-size:12.5px;color:var(--ink-3);line-height:1.75}
footer .note{margin-top:11px;padding-top:11px;border-top:1px solid var(--border);color:var(--ink-2)}

@media (max-width:640px){
  .wrap{max-width:100%;padding:0 16px}
  .card{grid-template-columns:1fr;gap:10px;align-items:start;padding:13px 14px}
  .meta{grid-column:1;flex-direction:row;align-items:center;justify-content:flex-start;
    text-align:left;gap:10px}
  .flabel{width:100%}
}
@media (prefers-color-scheme:dark){
  /* 深色模式的 primary-ink 是淺藍，當底色時要配深字才看得見 */
  .chip[aria-pressed="true"]{color:#1a1815}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

/* 時間篩選。
   刻意不把「今日／本週末」這種標籤存進資料裡，資料只存真實的 start / end 日期，
   區間在渲染當下用今天即時算出來。存標籤的話明天就失效了。 */
const TODAY = new Date(2026, 7, 2);          // 這份快照的基準日；正式版用 new Date()
/* 資料產生時間。正式版由 pipeline 寫進 events.json 的 generated_at，
   這裡是靜態快照所以寫死。一律存 ISO 8601 含時區，顯示時才轉成本地格式。 */
const GENERATED_AT = "2026-08-02T00:01:00+08:00";
const iso = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
const shift = (dt, days) => { const x = new Date(dt); x.setDate(x.getDate()+days); return x; };

function weekendOf(base){
  // 台灣週末＝週六、週日。回傳 base 當週（或之後最近）的週六到週日
  const dow = base.getDay();                 // 0=日 6=六
  const toSat = dow === 0 ? -1 : 6 - dow;    // 週日視為該週末的第二天
  const sat = shift(base, toSat);
  return [iso(sat), iso(shift(sat, 1))];
}
function monthRange(base, offset){
  const y = base.getFullYear(), m = base.getMonth() + offset;
  return [iso(new Date(y, m, 1)), iso(new Date(y, m + 1, 0))];
}
function buildBands(){
  const t = iso(TODAY);
  const [ws, we] = weekendOf(TODAY);
  const [ns, ne] = weekendOf(shift(TODAY, 7));
  const [ms, me] = monthRange(TODAY, 0);
  const [nms, nme] = monthRange(TODAY, 1);
  return [
    { k:"today",   label:"今日",      a:t,   b:t   },
    { k:"weekend", label:"本週末",    a:ws,  b:we  },
    { k:"nextwk",  label:"下週末",    a:ns,  b:ne  },
    { k:"month",   label:"本月",      a:ms,  b:me  },
    { k:"nextwe",  label:"下個月週末", a:nms, b:nme, weekendOnly:true },
    { k:"nextmo",  label:"下個月",    a:nms, b:nme },
    { k:"any",     label:"不限",      a:null, b:null },
  ];
}
const TIME_BANDS = buildBands();

/* 活動檔期與區間有重疊就算命中。
   「下個月週末」再多一層：檔期裡必須真的包含某個週六或週日。 */
function inBand(e, band){
  if (!band.a) return true;
  if (!e.start || !e.end) return false;
  if (!(e.start <= band.b && e.end >= band.a)) return false;
  if (!band.weekendOnly) return true;
  const from = e.start > band.a ? e.start : band.a;
  const to   = e.end   < band.b ? e.end   : band.b;
  for (let dt = new Date(from); iso(dt) <= to; dt = shift(dt, 1)) {
    const dw = dt.getDay();
    if (dw === 0 || dw === 6) return true;
  }
  return false;
}

  { k:"any", label:"不限",    test:() => true },
];
const state = { q:"", time:"today", walk:"any", city:new Set(), cat:new Set() };

/* 全文搜尋索引：標題、場館、縣市、行政區、車站、類別、運具都納入。
   台/臺 互通，這兩個字在台灣資料裡混用得很嚴重，
   使用者打「台北」不該搜不到「臺北市」。 */
const norm = s => String(s || "").toLowerCase().replace(/臺/g, "台");
function prepare(){
  EVENTS.forEach(e => {
    e.walk = e.meters ? Math.max(1, Math.round(e.meters / 80)) : null;
    e.lines = e.kind === "台鐵" ? [] : (STLINE[(e.st || "").replace(/站$/, "")] || []);
    e._hay = norm([e.t, e.venue, e.city, e.dist, e.st, e.cat, e.kind, e.fee].join(" "));
  });
}
prepare();
const hitsQuery = e => !state.q || state.q.split(/\s+/).every(w => e._hay.includes(w));
const uniq = a => [...new Set(a)];
const CITIES = uniq(EVENTS.map(e => e.city));
const CATS   = uniq(EVENTS.map(e => e.cat));

function passesExcept(e, skip){
  if (!hitsQuery(e)) return false;          // 搜尋永遠生效，篩選鈕的數字也要跟著縮
  if (skip !== "time" && !inBand(e, TIME_BANDS.find(b => b.k === state.time))) return false;
  if (skip !== "walk" && !WALK_BANDS.find(b => b.k === state.walk).test(e)) return false;
  if (skip !== "city" && state.city.size && !state.city.has(e.city)) return false;
  if (skip !== "cat"  && state.cat.size  && !state.cat.has(e.cat))  return false;
  return true;
}
const matches = e => passesExcept(e, null);

function chip(label, pressed, count, onClick){
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button";
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.innerHTML = label + `<span class="n mono">${count}</span>`;
  b.disabled = count === 0 && !pressed;
  if (b.disabled) b.style.opacity = ".38";
  b.addEventListener("click", onClick);
  return b;
}
function buildFilters(){
  const tm = document.getElementById("f-time"); tm.textContent = "";
  TIME_BANDS.forEach(b => {
    const n = EVENTS.filter(e => inBand(e, b) && passesExcept(e, "time")).length;
    tm.appendChild(chip(b.label, state.time === b.k, n, () => { state.time = b.k; render(); }));
  });
  const w = document.getElementById("f-walk"); w.textContent = "";
  WALK_BANDS.forEach(b => {
    const n = EVENTS.filter(e => b.test(e) && passesExcept(e, "walk")).length;
    w.appendChild(chip(b.label, state.walk === b.k, n, () => { state.walk = b.k; render(); }));
  });
  const mk = (id, vals, set, key, label) => {
    const host = document.getElementById(id); host.textContent = "";
    vals.forEach(v => {
      const n = EVENTS.filter(e => e[key] === v && passesExcept(e, key)).length;
      host.appendChild(chip(label ? label(v) : v, set.has(v), n, () => {
        set.has(v) ? set.delete(v) : set.add(v); render();
      }));
    });
  };
  mk("f-city", CITIES, state.city, "city");
  mk("f-cat",  CATS,   state.cat,  "cat", v => `${catEmoji(v)} ${v}`);
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* 站名對得到北捷路線就用路線色；對不到就依系統別上色。
   台北捷運公司那份出入口資料不含三鶯線、淡海輕軌、安坑輕軌與台鐵，
   所以「不在 LINES 裡」不等於「沒有軌道運輸」。 */
function bars(e){
  if (e.lines.length)
    return `<span class="bars">${e.lines.map(c =>
      `<i class="bar" style="background:var(--${c})"></i>`).join("")}</span>`;
  const k = e.kind || "";
  const colors = [];
  if (k.includes("台鐵")) colors.push("var(--TRA)");
  if (k.includes("三鶯")) colors.push("var(--LB)");
  if (k.includes("輕軌")) colors.push("var(--LRT)");
  if (!colors.length) colors.push("var(--ink-3)");
  return `<span class="bars">${colors.map(c =>
    `<i class="bar" style="background:${c}"></i>`).join("")}</span>`;
}
function transHtml(e){
  if (!e.st) return `<span class="trans none">無交通資訊</span>`;
  const sys = (!e.lines.length && e.kind && e.kind !== "捷運")
    ? ` <span class="until">${esc(e.kind)}</span>` : "";
  return `<span class="trans">${bars(e)}${esc(e.st)}
    <span class="walk mono">${e.walk}</span>分${sys}</span>`;
}
/* 只標「免費」。「付費」「未標示」對決策沒幫助，點進活動頁就會看到票價，
   全部標出來只是讓畫面變吵。 */
function feeHtml(e){
  return e.fee === "免費" ? `<span class="tag free">免費</span>` : "";
}
/* 使用者要知道自己會被帶到哪。導去場館官網而不是活動頁時，
   必須講清楚，不然點進去找不到那檔活動會覺得被騙。
   完全沒有連結時，改標資料來源，讓使用者知道這筆是哪裡來的、可以去哪查證。 */
function linkHint(e){
  if (!e.url)
    return `<span class="nolink">資料來源：${esc(e.src || "文化部 iCulture")}</span>`;
  if (e.urlKind === "Google 搜尋")
    return `<span class="nolink">🔍 Google 搜尋 <span aria-hidden="true">↗</span></span>`;
  return `<span class="nolink golink">前往活動頁 <span aria-hidden="true">↗</span></span>`;
}
/* 常設展的結束日多半是行政上的年度區間（例如 2026-12-31），
   不是真的那天就撤展，所以不顯示日期，改標「常設展」。 */
const endHtml = e => {
  if (e.ongoing) return `<span class="until perm">常設展</span>`;
  if (!e.end) return "";
  const [y, m, dd] = e.end.split("-");
  return `<span class="until">${+y > 2027 ? "長期展出" : `至 ${+m}/${+dd}`}</span>`;
};

const GROUPS = [
  { max:5,        title:"步行 5 分鐘內",  note:"出站就到" },
  { max:10,       title:"步行 10 分鐘內", note:"順路走過去" },
  { max:Infinity, title:"再遠一點",       note:"建議轉乘公車或騎車" },
  { max:null,     title:"無交通資訊",     note:"八里、金山這類地區，最近車站超過 1.5 公里" },
];

function cardHtml(e){
  const inner = `
    <div class="body">
      <div class="title">${esc(e.t)}</div>
      <div class="venue"><span class="pill">${catEmoji(e.cat)} ${esc(e.cat)}</span>
        ${esc(e.venue)} · ${esc(e.city)}${esc(e.dist || "")}</div>
      <div class="foot">${transHtml(e)}${linkHint(e)}</div>
    </div>
    <div class="meta">${feeHtml(e)}${endHtml(e)}</div>`;
  const style = `style="--c:${catColor(e.cat)}"`;
  return e.url
    ? `<a class="card" ${style} href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
    : `<div class="card" ${style}>${inner}</div>`;
}

function render(){
  buildFilters();
  const hits = EVENTS.filter(matches);
  const cnt = document.getElementById("count"), list = document.getElementById("list");
  list.textContent = "";
  if (!hits.length){
    cnt.textContent = "";
    const d = document.createElement("div"); d.className = "empty";
    d.innerHTML = state.q
      ? `<p>找不到符合「${esc(qInput.value.trim())}」的活動。<br>
           試試看車站名、場館名，或活動名稱裡的關鍵字。</p>`
      : `<p>這組條件沒有符合的活動。<br>試著換一個時間範圍，或放寬步行距離。</p>`;
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.textContent = state.q ? "清除搜尋與條件" : "清除全部條件";
    b.addEventListener("click", reset); d.appendChild(b);
    list.appendChild(d); return;
  }
  cnt.textContent = `符合 ${hits.length} 筆，共 ${EVENTS.length} 筆`;

  let lower = 0;
  GROUPS.forEach(g => {
    const items = g.max === null
      ? hits.filter(e => e.walk === null)
      : hits.filter(e => e.walk !== null && e.walk > lower && e.walk <= g.max);
    if (g.max !== null) lower = g.max;
    if (!items.length) return;
    const sec = document.createElement("section");
    sec.innerHTML = `<div class="ghead"><span class="dot"></span><h2>${g.title}</h2>
      <em>${items.length} 筆 · ${g.note}</em></div>
      <div class="grid">${items.map(cardHtml).join("")}</div>`;
    list.appendChild(sec);
  });
}
function clearFilters(){
  state.time = "today"; state.walk = "any"; state.city.clear(); state.cat.clear();
}
function reset(){
  clearFilters();
  state.q = ""; qInput.value = ""; qClear.hidden = true;
  render();
}
/* 正式部署時讀 dist/events.json（每天由 GitHub Actions 更新）。
   讀不到就沿用內嵌的靜態快照，這樣直接用瀏覽器開檔也能看。 */
(async function loadLive(){
  try{
    const r = await fetch("dist/events.json", {cache:"no-cache"});
    if(!r.ok) return;
    const p = await r.json();
    if(!p || !Array.isArray(p.events) || p.events.length < 20) return;
    EVENTS.length = 0;
    p.events.forEach(e => EVENTS.push({
      t:e.title, cat:e.category, venue:e.venue, city:e.city, dist:e.district,
      st:e.mrt && e.mrt.station, meters:e.mrt && e.mrt.meters,
      kind:(e.mrt && e.mrt.kind) || "捷運",
      fee:e.price_tier, pmin:e.price_min, start:e.start, end:e.end,
      url:e.url, urlKind:e.url_kind, img:e.image, src:e.source, ongoing:!!e.ongoing,
    }));
    if(p.generated_at) window.__GEN = p.generated_at;
    prepare(); render(); showUpdated();
  }catch(_){ /* 本機開檔會被 CORS 擋，維持內嵌快照即可 */ }
})();

function showUpdated(){
  const d = new Date(window.__GEN || GENERATED_AT);
  const pad = n => String(n).padStart(2, "0");
  document.getElementById("updated").textContent =
    `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
showUpdated();

document.getElementById("reset").addEventListener("click", reset);

const qInput = document.getElementById("q");
const qClear = document.getElementById("qclr");
qInput.addEventListener("input", () => {
  const v = norm(qInput.value.trim());
  if (v === state.q) return;
  state.q = v;
  qClear.hidden = !qInput.value;
  // 開始搜尋時先把篩選條件清掉，讓使用者從完整結果重新篩
  clearFilters();
  render();
});
qClear.addEventListener("click", () => {
  qInput.value = ""; state.q = ""; qClear.hidden = true;
  qInput.focus(); render();
});

render();
</script>
</body>
</html>
